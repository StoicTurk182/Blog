<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #1a1a1a; stroke: #00d4ff; stroke-width: 2; }
      .text { fill: #ffffff; font-family: 'Courier New', monospace; font-size: 14px; }
      .title { fill: #00d4ff; font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold; }
      .ip { fill: #7ed321; font-family: 'Courier New', monospace; font-size: 13px; }
      .arrow { stroke: #00d4ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .nat { fill: #ff9500; font-family: 'Courier New', monospace; font-size: 11px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff" />
    </marker>
  </defs>
  
  <!-- Black Background -->
  <rect width="600" height="700" fill="#000000"/>
  
  <!-- Title -->
  <text x="300" y="35" class="title" text-anchor="middle">OpenVPN Multi-NAT Traversal</text>
  
  <!-- Client -->
  <rect x="200" y="60" width="200" height="60" rx="5" class="box"/>
  <text x="300" y="85" class="title" text-anchor="middle">Mobile Client</text>
  <text x="300" y="105" class="ip" text-anchor="middle">203.0.113.45:54321</text>
  
  <!-- Arrow -->
  <line x1="300" y1="120" x2="300" y2="160" class="arrow"/>
  <text x="320" y="145" class="nat">UDP:1194</text>
  
  <!-- UDR -->
  <rect x="200" y="160" width="200" height="80" rx="5" class="box"/>
  <text x="300" y="185" class="title" text-anchor="middle">UniFi Dream Router</text>
  <text x="300" y="203" class="nat" text-anchor="middle">NAT #1</text>
  <text x="300" y="220" class="ip" text-anchor="middle">→ 10.1.10.20:1194</text>
  
  <!-- Arrow -->
  <line x1="300" y1="240" x2="300" y2="280" class="arrow"/>
  
  <!-- Windows Host -->
  <rect x="200" y="280" width="200" height="80" rx="5" class="box"/>
  <text x="300" y="305" class="title" text-anchor="middle">Windows Host</text>
  <text x="300" y="323" class="text" text-anchor="middle">VirtualBox</text>
  <text x="300" y="340" class="nat" text-anchor="middle">NAT #2</text>
  <text x="300" y="355" class="ip" text-anchor="middle">→ 10.0.2.15:1194</text>
  
  <!-- Arrow -->
  <line x1="300" y1="360" x2="300" y2="400" class="arrow"/>
  
  <!-- pfSense -->
  <rect x="200" y="400" width="200" height="80" rx="5" class="box"/>
  <text x="300" y="425" class="title" text-anchor="middle">pfSense VM</text>
  <text x="300" y="443" class="ip" text-anchor="middle">WAN: 10.0.2.15</text>
  <text x="300" y="463" class="text" text-anchor="middle">OpenVPN Server</text>
  
  <!-- Success indicator -->
  <circle cx="300" cy="510" r="25" fill="none" stroke="#7ed321" stroke-width="2"/>
  <text x="300" y="518" class="title" text-anchor="middle" fill="#7ed321">✓</text>
  
  <!-- Legend -->
  <rect x="50" y="560" width="500" height="120" rx="5" fill="#0a0a0a" stroke="#00d4ff" stroke-width="1"/>
  <text x="70" y="585" class="title">Traffic Path:</text>
  <text x="70" y="605" class="text">Internet → UDR (NAT) → Windows (NAT) → pfSense</text>
  
  <text x="70" y="635" class="title">Key Issue:</text>
  <text x="70" y="655" class="text">Broken firewall alias prevented rule loading.</text>
  <text x="70" y="670" class="text">GUI showed pass rule, kernel had stale rules.</text>
</svg>
