<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90d9"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Double NAT DDNS Solution</text>
  
  <!-- Internet Cloud -->
  <ellipse cx="100" cy="150" rx="70" ry="45" fill="#2d3748" stroke="#4a90d9" stroke-width="2"/>
  <text x="100" y="145" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Internet</text>
  <text x="100" y="165" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="11">Public IP</text>
  
  <!-- ISP Router -->
  <rect x="220" y="115" width="120" height="70" rx="8" fill="#2d3748" stroke="#e67e22" stroke-width="2"/>
  <text x="280" y="145" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ISP Router</text>
  <text x="280" y="165" text-anchor="middle" fill="#e67e22" font-family="Arial, sans-serif" font-size="11">203.0.113.x</text>
  <text x="280" y="178" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="9">(Public IP)</text>
  
  <!-- UniFi Gateway -->
  <rect x="400" y="115" width="120" height="70" rx="8" fill="#2d3748" stroke="#9b59b6" stroke-width="2"/>
  <text x="460" y="140" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">UniFi UDR</text>
  <text x="460" y="158" text-anchor="middle" fill="#9b59b6" font-family="Arial, sans-serif" font-size="11">192.168.1.12</text>
  <text x="460" y="171" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="9">(Private - WAN)</text>
  <text x="460" y="183" text-anchor="middle" fill="#27ae60" font-family="Arial, sans-serif" font-size="9">OpenVPN :1194</text>
  
  <!-- Windows Workstation -->
  <rect x="580" y="115" width="130" height="70" rx="8" fill="#2d3748" stroke="#27ae60" stroke-width="2"/>
  <text x="645" y="140" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Workstation</text>
  <text x="645" y="158" text-anchor="middle" fill="#27ae60" font-family="Arial, sans-serif" font-size="11">DDNS Script</text>
  <text x="645" y="175" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="9">PowerShell</text>
  
  <!-- Cloudflare -->
  <rect x="720" y="250" width="140" height="70" rx="8" fill="#2d3748" stroke="#f39c12" stroke-width="2"/>
  <text x="790" y="275" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Cloudflare DNS</text>
  <text x="790" y="295" text-anchor="middle" fill="#f39c12" font-family="Arial, sans-serif" font-size="11">home.orionnet.xyz</text>
  <text x="790" y="310" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="9">A Record → 203.0.113.x</text>
  
  <!-- IP Check Service -->
  <rect x="580" y="250" width="110" height="55" rx="8" fill="#2d3748" stroke="#3498db" stroke-width="2"/>
  <text x="635" y="275" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">api.ipify.org</text>
  <text x="635" y="293" text-anchor="middle" fill="#3498db" font-family="Arial, sans-serif" font-size="10">Returns: 203.0.113.x</text>
  
  <!-- VPN Client -->
  <rect x="40" y="340" width="120" height="60" rx="8" fill="#2d3748" stroke="#e74c3c" stroke-width="2"/>
  <text x="100" y="365" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">VPN Client</text>
  <text x="100" y="385" text-anchor="middle" fill="#e74c3c" font-family="Arial, sans-serif" font-size="10">Mobile / Remote</text>
  
  <!-- Connection Lines -->
  <!-- Internet to ISP Router -->
  <line x1="170" y1="150" x2="218" y2="150" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ISP Router to UDR -->
  <line x1="340" y1="150" x2="398" y2="150" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="140" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="9">NAT</text>
  
  <!-- UDR to Workstation -->
  <line x1="520" y1="150" x2="578" y2="150" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="550" y="140" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="9">LAN</text>
  
  <!-- Workstation to IP Check (green - DDNS flow) -->
  <line x1="645" y1="185" x2="635" y2="248" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="620" y="220" text-anchor="middle" fill="#27ae60" font-family="Arial, sans-serif" font-size="9">1. Query IP</text>
  
  <!-- Workstation to Cloudflare (green - DDNS flow) -->
  <path d="M 710 150 Q 780 150 790 248" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="770" y="190" text-anchor="middle" fill="#27ae60" font-family="Arial, sans-serif" font-size="9">2. Update DNS</text>
  
  <!-- VPN Client to Cloudflare (orange - VPN flow) -->
  <path d="M 160 370 Q 450 420 720 300" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-orange)"/>
  <text x="420" y="410" text-anchor="middle" fill="#e67e22" font-family="Arial, sans-serif" font-size="10">3. DNS Lookup</text>
  
  <!-- VPN Client to ISP Router (orange - VPN flow) -->
  <path d="M 100 340 Q 100 280 220 185" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  <text x="130" y="270" text-anchor="middle" fill="#e67e22" font-family="Arial, sans-serif" font-size="10">4. Connect</text>
  
  <!-- Port Forward indicator -->
  <text x="280" y="205" text-anchor="middle" fill="#e67e22" font-family="Arial, sans-serif" font-size="9">Port Forward</text>
  <text x="280" y="218" text-anchor="middle" fill="#e67e22" font-family="Arial, sans-serif" font-size="9">1194 → UDR</text>
  
  <!-- Legend -->
  <rect x="30" y="430" width="840" height="55" rx="5" fill="#16213e" stroke="#4a5568" stroke-width="1"/>
  <text x="50" y="452" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Flow:</text>
  
  <line x1="100" y1="448" x2="140" y2="448" stroke="#27ae60" stroke-width="2"/>
  <text x="150" y="452" fill="#27ae60" font-family="Arial, sans-serif" font-size="11">DDNS Update (Workstation → Cloudflare)</text>
  
  <line x1="380" y1="448" x2="420" y2="448" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="430" y="452" fill="#e67e22" font-family="Arial, sans-serif" font-size="11">VPN Connection (Client → Home)</text>
  
  <text x="50" y="472" fill="#a0aec0" font-family="Arial, sans-serif" font-size="10">The workstation queries external IP services to discover the real public IP, bypassing double NAT visibility limitations.</text>
  
  <!-- Double NAT Box -->
  <rect x="210" y="100" width="320" height="100" rx="10" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="370" y="92" text-anchor="middle" fill="#e74c3c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Double NAT Zone</text>
</svg>
