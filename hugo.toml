baseURL = 'https://blog.ajolnet.com/'
title = 'Andy J Blog - Trials of an IT Engineer'
theme = 'mainroad'
languageCode = 'en-us'
author = "Andrew Jones"
copyright = "© 2025 Andrew Jones. All rights reserved."

[params]
  description = "Personal Projects"
  readmore = true
  authorbox = true
  pager = true
  toc = true
  mathjax = true
  readingTime = true
  post_meta = ["author", "date", "categories", "readingtime"]
  author = "Andrew Jones"
  authorbio = "IT engineer with 5 years in the industry and a lifetime of hands-on experience with computers. Passionate about gaming technology, cybersecurity, and creating educational content that makes complex topics accessible."
  authoravatar = "/images/posts/Andrew.png"

  [params.logo]
    title = "Projects 2025"
    subtitle = "Information Technology Musings"

  [params.style]
    background = "#1a1a1a"
    text = "#e0e0e0"

  [params.sidebar]
    home = true
    single = false
    list = false
    widgets = ["recent", "categories", "social"]

  [params.social]
    youtube = "https://www.youtube.com/@saraf01"

  [params.widgets]
    recent_num = 5
    categories_counter = true
    tags_counter = true

  [params.comments]
    utterances = true
    utterancesRepo = "StoicTurk182/Blog"
    utterancesIssueTerm = "pathname"
    utterancesTheme = "github-dark"

# REMOVED the problematic customCSS line that was causing skipping

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 2

[[menu.main]]
  name = "Tech News"
  url = "/tech-newsletter/weekly-update-1/"
  weight = 10

[[menu.main]]
  name = "Tools"
  url = "/tools/"
  weight = 20

[[menu.main]]
  name = "Videos"  # ← ADD THIS LINE
  url = "/videos/" # ← ADD THIS LINE  
  weight = 30      # ← ADD THIS LINE

[[menu.main]]
  name = "Contact"  # ← ADD THIS LINE
  url = "/contact/" # ← ADD THIS LINE  
  weight = 30      # ← ADD THIS LINE

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = true

[[module.mounts]]
  source = 'content'
  target = 'content'

[[module.mounts]]
  source = 'data'
  target = 'data'

[[module.mounts]]
  source = 'layouts'
  target = 'layouts'

[[module.mounts]]
  source = 'i18n'
  target = 'i18n'

[[module.mounts]]
  source = 'archetypes'
  target = 'archetypes'

[[module.mounts]]
  source = 'assets'
  target = 'assets'

[[module.mounts]]
  source = 'static'
  target = 'static'

[[module.mounts]]
  source = 'themes/mainroad/assets'
  target = 'assets'

# ===== MINIFICATION & OPTIMIZATION =====
[build]
  writeStats = true

[minify]
  minifyOutput = true

[minify.tdewolff]
  [minify.tdewolff.html]
    keepWhitespace = false
  [minify.tdewolff.css]
    keepWhitespace = false
  [minify.tdewolff.js]
    keepWhitespace = false  