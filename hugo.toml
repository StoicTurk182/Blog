[params]
  description = "Personal Projects"

  [params.logo]
    title = "Projects 2025"
    subtitle = "Information Technology Musings"

 [params.style]
  # Check theme documentation for available variables
  background = "#1a1a1a"
  text = "#e0e0e0"

  # CORRECT WIDGET CONFIGURATION
  [params.sidebar]
    # Enable sidebar on different page types
    home = true
    single = true  
    list = true

    # Widgets configuration
    widgets = ["recent", "categories", "social", "search"]

     [params.social]
    youtube = "https://www.youtube.com/@saraf01"

