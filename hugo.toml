baseURL = 'http://localhost:1313/'
title = 'My Blog'
theme = 'mainroad'
languageCode = 'en-us'
author = "Andrew Jones"
copyright = "© 2025 Andrew Jones. All rights reserved."

[params]
  description = "My personal blog"

  [params.logo]
    title = "Projects 2025"
    subtitle = "Information Technology Musings"

 [params.style]
  # Check theme documentation for available variables
  background = "#1a1a1a"
  text = "#e0e0e0"

  # CORRECT WIDGET CONFIGURATION
  [params.sidebar]
    # Enable sidebar on different page types
    home = true
    single = true  
    list = true
    
    # Widgets configuration
    widgets = ["recent", "categories", "social", "search"]

    [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true      