baseURL = 'https://blog.ajolnet.com/'
title = 'Andy J Blog - Trials of an IT Engineer'
theme = 'mainroad'
languageCode = 'en-us'
author = "Andrew Jones"
copyright = "© 2025 Andrew Jones. All rights reserved."

[params]
  description = "Personal Projects"
  readmore = true          # Show "Read more" button in lists
  authorbox = true         # Show author box at bottom of pages
  pager = true             # Show prev/next navigation (this is showPostNav)
  toc = true               # Enable Table of Contents
  mathjax = true           # Enable MathJax (math equations)
  readingTime = true
  post_meta = ["author", "date", "categories","readingtime"] 
  author = "Andrew Jones"
  authorbio = "IT Technical Engineer and technology enthusiast with 20+ years of experience in gaming and content creation. Passionate about cybersecurity, networking, and sharing knowledge through technical writing and video production."
  authoravatar = "/images/posts/Andrew.png"

  [params.logo]
    title = "Projects 2025"
    subtitle = "Information Technology Musings"

 [params.style]
  # Check theme documentation for available variables
  background = "#1a1a1a"
  text = "#e0e0e0"

  # CORRECT WIDGET CONFIGURATION
  [params.sidebar]
    # Enable sidebar on different page types
    home = true
    single = true  
    list = true

    # Widgets configuration
    widgets = ["recent", "categories", "social", "taglist"]

     [params.social]
    youtube = "https://www.youtube.com/@saraf01"

# ADD MAIN MENU ITEM
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 2

[[menu.main]]
  name = "Videos"
  url = "/Videos/"
  weight = 3

[[menu.main]]
    name = "Contact Me"
    url = "/contact/"
    weight = 100

    [[menu.main]]
name = "Tech News"
url = "/tech-newsletter/weekly-update-1/"
weight = 10

[[menu.main]]
name = "Tools"
url = "/tools/"
weight = 20

  [params.widgets]
  recent_num = 5
  categories_counter = true
  tags_counter = true

    [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true    

   [params.comments]
  utterances = true
  utterancesRepo = "StoicTurk182/Blog"
  utterancesIssueTerm = "pathname"
  utterancesTheme = "github-dark"