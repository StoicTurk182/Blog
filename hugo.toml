baseURL = 'http://localhost:1313/'
title = 'My Blog'
theme = 'mainroad'
languageCode = 'en-us'
author = "Andrew Jones"
copyright = "© 2025 Andrew Jones. All rights reserved."

[params]
  description = "My personal blog"
  
  [params.logo]
    title = "Projects 2025"
    subtitle = "Information Technology Musings"

  # Social links
  [[params.social]]
    name = "github"
    url = "https://github.com/andrewjones"

  [[params.social]]
    name = "twitter" 
    url = "https://twitter.com/andrewjones"

  [[params.social]]
    name = "linkedin"
    url = "https://linkedin.com/in/andrewjones"

  # CORRECT WIDGET CONFIGURATION
  [params.sidebar]
    # Enable sidebar on different page types
    home = true
    single = true  
    list = true
    
    # Widgets configuration
    widgets = ["recent", "categories", "social", "search"]

    [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true