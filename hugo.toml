baseURL = 'http://localhost:1313/'
title = 'My Blog'
theme = 'mainroad'
languageCode = 'en-us'
author = "Andrew Jones"
copyright = "© 2025 Andrew Jones. All rights reserved."

[params]
  description = "My personal blog"
  
  # Mainroad logo settings
  [params.logo]
    title = "Projects 2025"
    subtitle = "Information Technology Musings"

  # Use available widgets - remove the about widget section
  # Mainroad supports these widgets: recent, categories, taglist, social, search

  # Social links will display your info
  [[params.social]]
    name = "github"
    url = "https://github.com/andrewjones"

  [[params.social]]
    name = "twitter" 
    url = "https://twitter.com/andrewjones"

  [[params.social]]
    name = "linkedin"
    url = "https://linkedin.com/in/andrewjones"

# Enable sidebar widgets (these are the available ones)
[params.widgets]
    recent = true
    categories = true
    taglist = true
    social = true