<script src="https://unpkg.com/@barba/core"></script>
<script>
// Wait for complete page load
window.addEventListener('load', function() {
    console.log('🚀 Page fully loaded, initializing Barba...');
    initializeBarba();
});

function initializeBarba() {
    const wrapper = document.getElementById('barba-wrapper');
    const container = document.querySelector('[data-barba="container"]');
    
    console.log('🔍 Checking for Barba elements:');
    console.log(' - barba-wrapper:', wrapper);
    console.log(' - barba-container:', container);
    
    if (!wrapper) {
        console.error('❌ ERROR: No element with id="barba-wrapper" found');
        return;
    }
    
    if (!container) {
        console.error('❌ ERROR: No element with data-barba="container" found');
        return;
    }

    // Initialize Barba.js
    barba.init({
        transitions: [{
            async leave(data) {
                data.current.container.style.opacity = 0;
                data.current.container.style.transition = 'opacity 0.3s ease';
                await new Promise(r => setTimeout(r, 300));
            },
            async enter(data) {
                data.next.container.style.opacity = 1;
                data.next.container.style.transition = 'opacity 0.3s ease';
                await new Promise(r => setTimeout(r, 300));
                window.scrollTo(0, 0);
            }
        }],
        prevent: ({ el }) => el.href.includes('://') || el.target === '_blank'
    });
    
    console.log('✅ Barba.js successfully initialized!');
}
</script>

<style>
#barba-wrapper { position: relative; min-height: 60vh; }
.barba-container { opacity: 1; }
</style>
