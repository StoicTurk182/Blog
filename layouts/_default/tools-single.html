{{ define "main" }}
<div class="tool-single-page">
    <!-- Hero Section -->
    <section class="tool-hero">
        
        <div class="hero-content">
            <div class="tool-header">
                <span class="tool-badge">Tool</span>
                <!-- READING TIME SHOULD BE HERE, in the tool-header -->
                <span class="reading-time">• {{ .ReadingTime }} min read</span>
                {{ with .Params.version }}
                <span class="tool-version">v{{ . }}</span>
                {{ end }}
            </div>
            <h1 class="hero-title">{{ .Title }}</h1>
            {{ with .Params.subtitle }}
            <p class="hero-description">{{ . }}</p>
            {{ end }}
        </div>
    </section>
<a href="/tools/" class="read-more back-button" style="float: right; margin: 2rem 0;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0L9.41 1.41L3.83 7H16V9H3.83L9.41 14.59L8 16L0 8L8 0Z"></path>
        </svg>
        Back to Tools
    </a>
    <!-- Tool Content Section -->
    <section class="tool-content-section">
        <div class="tool-actions">
        

            <div class="post-nav-right">
    {{ with .Params.tool_image }}
    <a href="{{ $.Params.download_url }}" class="tool-image-link">
        <img src="/images/posts/{{ . }}" alt="{{ $.Title }} logo" class="tool-image">
    </a>
    {{ end }}
</div>
        </div>

        <!-- Main Content -->
        <article class="tool-article">
            {{ .Content }}
            
        </article>

        <!-- Additional Actions -->
        <div class="tool-footer-actions">
            {{ with .Params.download_url }}
            <a href="{{ . }}" class="card-link download-link">Download Tool</a>
            {{ end }}
        </div>
    </section>

    
</div>


<style>

/* Simple Consistent Tool Image Sizing */
/* Simple Consistent Tool Image Sizing - Mobile Aware */
/* Simple Consistent Tool Image Sizing - Mobile Aware */
.tool-image {
    height: 250px !important;
    width: auto !important;
    display: block !important;
    border: none !important;
    border-radius: 4px;
    transition: transform 0.2s ease;
}

.tool-image-link {
    display: inline-block !important;
    text-decoration: none !important;
    border: none !important;
    background: transparent !important;
}

.tool-image-link:hover .tool-image {
    transform: translateY(-2px);
    opacity: 0.9;
}

/* Mobile adjustment */
@media (max-width: 768px) {
    .tool-image {
        height: 200px !important;
    }
}

.tool-actions .btn-secondary {
    display: none;
}    

.read-more {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: #e53e3e;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s ease;
    border-bottom: 2px dotted transparent;
}

.read-more:hover {
    color: #c53030;
    border-bottom: 2px dotted #c53030;
}

.read-more svg {
    transition: transform 0.2s ease;
}

.read-more:hover svg {
    transform: translateX(-7px);
}
    
.reading-time {
    color: #64748b;
    font-size: 0.9rem;
    font-weight: 500;
}

.tool-single-page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem;
}

/* Tool Hero Section - Mobile First */
.tool-hero {
    text-align: center;
    padding: 1.5rem 0 1rem;
    border-bottom: 1px solid #e5e7eb;
    margin-bottom: 1.5rem;
}

.tool-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
}

.tool-badge {
    background: #f0f9ff;
    color: #0369a1;
    padding: 0.25rem 0.75rem;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 500;
    order: 1;
}

.tool-version {
    color: #6b7280;
    font-size: 0.8rem;
    font-family: monospace;
    order: 2;
}

.tool-hero .hero-title {
    font-size: 1.75rem;
    color: #1f2937;
    margin: 0 0 1rem;
    font-weight: 300;
    line-height: 1.3;
    order: 0; /* Title comes first on mobile */
}

.tool-hero .hero-description {
    font-size: 1.1rem;
    color: #6b7280;
    margin-bottom: 1.5rem;
    line-height: 1.5;
}

/* Tool Actions - Mobile Optimized */
.tool-actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    width: 100%;
}

.action-button {
    display: inline-block;
    padding: 0.75rem 1rem;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 500;
    text-align: center;
    transition: all 0.2s;
    font-size: 0.9rem;
    width: 100%;
}

/* Tool Metadata - Mobile Optimized */
.tool-meta {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1.5rem;
}

.meta-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #e5e7eb;
}

.meta-group:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
}

.meta-group strong {
    color: #374151;
    font-weight: 600;
    font-size: 0.9rem;
}

.categories, .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.category-tag {
    background: #fef2f2;
    color: #dc2626;
    padding: 0.25rem 0.75rem;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 500;
}

.tag {
    background: #f3f4f6;
    color: #374151;
    padding: 0.2rem 0.6rem;
    border-radius: 8px;
    font-size: 0.75rem;
    border: 1px solid #e5e7eb;
}

/* Tool Article - Mobile Optimized */
.tool-article {
    max-width: 800px;
    margin: 0 auto 2rem;
    line-height: 1.7;
    color: #374151;
    font-size: 0.95rem;
}

.tool-article h2 {
    color: #1f2937;
    font-weight: 400;
    margin: 1.5rem 0 1rem;
    font-size: 1.5rem;
}

.tool-article h3 {
    color: #374151;
    font-weight: 500;
    margin: 1.25rem 0 0.75rem;
    font-size: 1.25rem;
}

.tool-article p {
    margin-bottom: 1rem;
}

.tool-article ul, .tool-article ol {
    margin-bottom: 1rem;
    padding-left: 1.25rem;
}

.tool-article li {
    margin-bottom: 0.5rem;
}

/* Tool Footer Actions - Mobile Optimized */
.tool-footer-actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    justify-content: center;
    padding-top: 1.5rem;
    border-top: 1px solid #e5e7eb;
    margin-top: 1.5rem;
}

/* Button Styles - Mobile Optimized */
.btn-primary{
    background: transparent;
    color: #374151;
    padding: 0.75rem 1rem;
    text-decoration: none;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-weight: 500;
    transition: all 0.2s;
    display: block;
    text-align: center;
    font-size: 0.9rem;
}

.btn-primary:hover {
    background: #b91c1c;
}

.btn-primary:active {
    transform: scale(0.95);
    background: #991515;
    transition: transform 0.1s ease;
}

.btn-secondary {
    background: transparent;
    color: #374151;
    padding: 0.375rem 0.625rem; /* Even smaller */
    text-decoration: none;
    border: 1px solid #d1d5db;
    border-radius: 4px; /* Slightly smaller radius */
    font-weight: 500;
    transition: all 0.2s;
    display: inline-block; /* Changed from block if you want natural width */
    text-align: center;
    font-size: 0.75rem;
    line-height: 1; /* Tighter line height */
}

.btn-secondary:hover {
    border-color: #9ca3af;
    background: #f9fafb;
}

.btn-secondary:active {
    transform: scale(0.95);
    background: #e5e7eb;
    transition: transform 0.1s ease;
}

.card-link {
    background: transparent;
    color: #374151;
    padding: 0.75rem 1rem;
    text-decoration: none;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-weight: 500;
    transition: all 0.2s;
    display: block;
    text-align: center;
    font-size: 0.9rem;
}

.card-link:hover {
    text-decoration: underline;
}

.demo-link {
    background: #f0fdf4;
    color: #059669 !important;
    border: 1px solid #bbf7d0;
}

.demo-link:hover {
    background: #dcfce7;
    color: #047857 !important;
}

.download-link {
    background: transparent;
    color: #374151;
    padding: 0.75rem 1rem;
    text-decoration: none;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-weight: 500;
    transition: all 0.2s;
    display: block;
    text-align: center;
    font-size: 0.9rem;
}

.download-link:hover {
    border-color: #9ca3af;
    background: #f9fafb;
}

.download-link:active {
    transform: scale(0.95);
    background: #e5e7eb;
    transition: transform 0.1s ease;
}

/* Tablet and Desktop Styles */
@media (min-width: 768px) {
    .tool-single-page {
        padding: 0 1.5rem;
    }
    
    .tool-hero {
        padding: 2.5rem 0 1.5rem;
        margin-bottom: 2rem;
    }
    
    .tool-header {
        flex-direction: row;
        justify-content: center;
        gap: 1rem;
    }
    
    .tool-hero .hero-title {
        font-size: 2.25rem;
        order: 0;
    }
    
    .tool-badge, .tool-version {
        order: 1;
    }
    
    .tool-hero .hero-description {
        font-size: 1.25rem;
    }
    
    .tool-actions {
        flex-direction: row;
        justify-content: center;
        gap: 1rem;
    }
    
    .action-button {
        width: auto;
        min-width: 140px;
    }
    
    .tool-meta {
        padding: 1.5rem;
    }
    
    .meta-group {
        flex-direction: row;
        align-items: start;
        gap: 1rem;
    }
    
    .meta-group strong {
        min-width: 80px;
        font-size: 1rem;
    }
    
    .tool-article {
        font-size: 1rem;
        margin-bottom: 3rem;
    }
    
    .tool-article h2 {
        font-size: 1.75rem;
        margin: 2rem 0 1rem;
    }
    
    .tool-article h3 {
        font-size: 1.5rem;
    }
    
    .tool-footer-actions {
        flex-direction: row;
        gap: 1rem;
        padding-top: 2rem;
        margin-top: 2rem;
    }
    
    .btn-primary, .btn-secondary, .card-link {
        padding: 0.75rem 1.5rem;
    }
}

@media (min-width: 1024px) {
    .tool-hero .hero-title {
        font-size: 2.5rem;
    }
}

/* Small mobile devices */
@media (max-width: 360px) {
    .tool-single-page {
        padding: 0 0.75rem;
    }
    
    .tool-hero .hero-title {
        font-size: 1.5rem;
    }
    
    .tool-hero .hero-description {
        font-size: 1rem;
    }
    
    .categories, .tags {
        gap: 0.375rem;
    }
    
    .category-tag, .tag {
        font-size: 0.7rem;
    }
}
</style>
{{ end }}
