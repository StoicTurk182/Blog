{{ define "main" }}
<article class="content">
    <header class="content__header">
        <h1 class="content__title"> Site Search</h1>
    </header>
    <div class="content__body">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search tools and articles..." autofocus>
            <p class="search-hint">Enter at least 2 characters to begin</p>
        </div>
        <div id="search-results"></div>
    </div>
</article>

<style>
/* Container & Input */
.search-container { margin-bottom: 2.5rem; }
#search-input {
    width: 100%;
    padding: 1rem 1.25rem;
    border: 2px solid var(--border-primary, #eee);
    border-radius: 0px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-size: 1.2rem;
    transition: all 0.3s ease;
}
#search-input:focus {
    outline: none;
    border-color: #e53e3e;
    box-shadow: 0 4px 12px rgba(229, 62, 62, 0.1);
}
.search-hint { margin-top: 0.6rem; font-size: 0.85rem; color: #888; }

/* Results Header */
.results-count {
    padding-bottom: 12px;
    margin-bottom: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-primary, #1a1a1a); /* Updated to match your strong labels */
    border-bottom: 1px solid #eee;
}

/* Individual Result Item */
.search-result {
    display: flex;
    flex-direction: row;
    gap: 1.5rem;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--border-primary, #f0f0f0);
}
.search-result:last-child { border-bottom: none; }

.search-result-image {
    flex-shrink: 0;
    width: 100px;
    height: 75px;
    object-fit: cover;
    border-radius: 0.5px;
    background: #f7f7f7;
}

.search-result-content { flex: 1; min-width: 0; }
.search-result-title { margin: 0 0 0.4rem 0; font-size: 1.25rem; font-weight: 700; }

/* --- Updated Unified Links (Obsidian/Brand Red) --- */
.search-result-title a {
    color: rgb(0, 0, 0) !important;
    text-decoration: none !important;
    font-weight: 600 !important;
    border-bottom: 1px dotted transparent; 
    transition: border-color 0.3s ease, transform 0.1s ease;
    display: inline-block; /* Allows the active transform to move the text */
}

.search-result-title a:hover {
    color: #ff0000 !important;
    border-bottom: 1px dotted #ff0000 !important;
}

.search-result-title a:active {
    transform: translateY(1px); 
    color: #b91c1c !important;
    transition: none;
}

.search-result-summary {
    margin: 0;
    color: #666;
    font-size: 0.95rem;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* Mobile Responsive */
@media (max-width: 500px) {
    .search-result { flex-direction: column; gap: 1rem; }
    .search-result-image { width: 100%; height: 160px; }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
(function() {
    let fuse = null;
    
    function stripHtml(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
    }
    
    fetch('/index.json')
        .then(response => response.json())
        .then(data => {
            fuse = new Fuse(data, {
                keys: [
                    { name: 'title', weight: 0.9 },
                    { name: 'summary', weight: 0.5 },
                    { name: 'content', weight: 0.2 }
                ],
                threshold: 0.4,       // Fuzzy matching (0.4 is optimal)
                distance: 1000,       // Allow matches deep in long text
                ignoreLocation: true
            });
            
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            if (query) {
                document.getElementById('search-input').value = query;
                performSearch(query);
            }
        });
    
    document.getElementById('search-input').addEventListener('input', function(e) {
        performSearch(e.target.value);
    });
    
    function performSearch(query) {
        const resultsDiv = document.getElementById('search-results');
        if (!query || query.length < 2) {
            resultsDiv.innerHTML = '';
            return;
        }
        if (!fuse) return;
        
        const results = fuse.search(query);
        if (results.length === 0) {
            resultsDiv.innerHTML = '<p class="no-results">No matches found for "' + query + '"</p>';
            return;
        }
        
        let html = `<p class="results-count">Found ${results.length} results</p>`;
        
        results.slice(0, 15).forEach(result => {
            const item = result.item;
            const title = stripHtml(item.title || 'Untitled');
            const summary = stripHtml(item.summary || item.content || '').substring(0, 160);
            
            html += `
                <div class="search-result">
                    ${item.image ? `<img class="search-result-image" src="${item.image}" alt="" loading="lazy">` : ''}
                    <div class="search-result-content">
                        <h3 class="search-result-title"><a href="${item.permalink}">${title}</a></h3>
                        <p class="search-result-summary">${summary}...</p>
                    </div>
                </div>`;
        });
        
        resultsDiv.innerHTML = html;
    }
})();
</script>
{{ end }}
